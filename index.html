<!DOCTYPE html>
<html>
<head>
	<title>
		Student Login Page
	</title>
	<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
	<style>
		* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
		}

		body {
		font-family: 'Rubik', sans-serif;
		/* background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); */
		background: url('https://scontent.fpat11-1.fna.fbcdn.net/v/t39.30808-6/474102161_1088036903022234_5535109724639717569_n.jpg?stp=dst-jpg_s960x960_tt6&_nc_cat=110&ccb=1-7&_nc_sid=cc71e4&_nc_ohc=PE2l3FxuByMQ7kNvwH-outU&_nc_oc=AdkacZJ2hlHkCLQwQ2YCK_Y9qoz2aeNdaKsftSHTRLD0PcUhQdtuQ2tSJbvkcUHhgkILQ62iE_9xZ8Jx7mqwpGap&_nc_zt=23&_nc_ht=scontent.fpat11-1.fna&_nc_gid=A3zlq6GVyqecSkbXxkIOfg&oh=00_AfGxCsoYmH2VCzlLEHDQUwuoyOOflDI7Ajg0W4Nb_w5h1w&oe=68046316') no-repeat center center fixed;
		background-size: cover;
		
		min-height: 100vh;
		display: flex;
		justify-content: center;
		align-items: center;
		overflow: hidden;
		}

		.container {
		background: rgba(255, 255, 255, 0.95);
		width: 400px;
		padding: 40px;
		border-radius: 15px;
		box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
		position: relative;
		z-index: 1;
		animation: fadeIn 1s ease-in-out;
		}

		/* Animation for container */
		@keyframes fadeIn {
		from { opacity: 0; transform: translateY(-20px); }
		to { opacity: 1; transform: translateY(0); }
		}

		.logo {
		width: 80px;
		height: 80px;
		margin: 0 auto 20px;
		background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9yuoKzp6Q9Cx2OUbUw5_MGUltYj4A-Ys-nbQLRqNqFiaTRRxSp2WXhRSNEgAhybyhySE&usqp=CAU') no-repeat center;
		background-size: cover;
		border-radius: 50%;
		border: 3px solid #2a5298;
		}

		h2 {
		color: #1e3c72;
		font-size: 24px;
		margin-bottom: 30px;
		text-transform: uppercase;
		letter-spacing: 2px;
		text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
		text-align: center;
		}

		label {
		display: block;
		text-align: left;
		color: #333;
		font-size: 14px;
		margin: 10px 0 5px;
		font-weight: 700;
		}

		input[type="text"],
		input[type="password"],
		select {
		width: 100%;
		padding: 12px;
		margin-bottom: 15px;
		border: 2px solid #ccc;
		border-radius: 8px;
		font-size: 16px;
		transition: border-color 0.3s, box-shadow 0.3s;
		background: #f9f9f9;
		}

		input[type="text"]:focus,
		input[type="password"]:focus,
		select:focus {
		border-color: #2a5298;
		box-shadow: 0 0 8px rgba(42, 82, 152, 0.5);
		outline: none;
		background: #fff;
		}

		input[type="submit"] {
		width: 100%;
		padding: 12px;
		background: linear-gradient(90deg, #2a5298, #1e3c72);
		color: white;
		border: none;
		border-radius: 8px;
		font-size: 16px;
		font-weight: 700;
		cursor: pointer;
		transition: transform 0.2s, box-shadow 0.3s;
		}

		input[type="submit"]:hover {
		transform: translateY(-2px);
		box-shadow: 0 5px 15px rgba(42, 82, 152, 0.4);
		}

		select {
		appearance: none;
		background: #f9f9f9 url('data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"%3E%3Cpolyline points="6 9 12 15 18 9"%3E%3C/polyline%3E%3C/svg%3E') no-repeat right 10px center;
		background-size: 20px;
		}

		/* Responsive design */
		@media (max-width: 480px) {
		.container {
			width: 90%;
			padding: 20px;
		}
		h2 {
			font-size: 20px;
		}
		}
	</style>
</head>
<body>
	<div class="container">
		<h2>STUDENT LOGIN PAGE</h2>
		<form>
			<label for="role">Login as:</label>
			<select name="role" id="role">
				<option value="student">Student</option>
				<option value="admin">Admin</option>
			</select><br>
			<label for="roll">Roll Number:</label><br>
			<input type="text" id="username" name="username" placeholder="1234567" required><br>
			<label for="password">Password:</label><br>
			<input type="password" id="password" name="password" required><br>
			<input type="submit" value="Login">
		</form>
	</div>


	<script>
		document.querySelector("form").addEventListener("submit", async function(e) {
			e.preventDefault();
			const role = document.getElementById("role").value;
			const username = document.getElementById("username").value;
			const password = document.getElementById("password").value;

			try {
				const response = await fetch("http://localhost:4000/api/auth/login", {
					method:"POST",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify({
						username,
						password,
						role
					})
				});
				const data = await response.json();

				if(data.success){
					localStorage.setItem("login_email", data.email);
					localStorage.setItem("login_role", role);
					window.location.href = "./s1/index2.html";
				} else {
					alert(data.error || "Login Failed");
				}
			} catch (err) {
				alert("Error connecting to server");
				console.error(err);
			}
		});
	</script>
</body>
</html>
